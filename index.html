function formatTime(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function remaining(){return state.phase==='ready'?CONFIG.totalSeconds:Math.max(0,Math.ceil((deadline-Date.now())/1000))}
function refresh(){const left=remaining();$('timer').textContent=formatTime(left);$('timer').className='timer'+(left<=120?' urgent':'');if(left===0&&state.phase==='playing'){state.phase='lost';clearInterval(tick);renderPanel();show('訊號中斷，校園封鎖了','<p>你抵達了第 '+(state.room+1)+' 個房間，但時間已用盡。已完成 '+state.completed+' / 5 關。</p><div class="note">答錯 '+state.mistakes+' 次，共扣除 '+state.penalty+' 秒。下一次可以多比較兩份線索，再確認密碼。</div>',[['重新挑戰',reset,true]]);say('挑戰結束。五個場景仍等著你，重新開始即可再次探索。')}return left}
function guard(){return state.phase==='playing'&&refresh()>0}
function renderPanel(){const r=ROOMS[state.room];$('checklist').innerHTML=r.clues.map((c,i)=>'<li><span>'+(state.visited[state.room][i]?'✓':'○')+'</span>'+c.name+(state.visited[state.room][i]?' 已記錄':' 待調查')+'</li>').join('')+'<li><span>'+(state.solved?'✓':'○')+'</span>'+r.lockName+(state.solved?' 已解鎖':' 待解鎖')+'</li>';$('badges').innerHTML=state.badges.length?state.badges.map(b=>'<span class="badge">'+b.symbol+' '+b.name+' · '+b.digit+'</span>').join(''):'<span class="badge empty">通關後收集徽記</span>';$('mistakes').textContent=state.mistakes;$('hints').textContent=state.hints;for(let i=0;i<2;i++){const b=$('clue'+i);if(b)b.className='hotspot'+(state.visited[state.room][i]?' seen':'')}$('hint').disabled=state.phase!=='playing'||state.solved;$('journal').disabled=state.phase==='ready'}
function renderRoom(){const r=ROOMS[state.room];$('roomTitle').textContent=r.title;$('roomStory').textContent=r.story;$('objective').textContent=r.objective;$('location').textContent=r.location;$('difficulty').textContent='難度 '+'●'.repeat(state.room+1)+'○'.repeat(4-state.room);$('route').innerHTML=ROOMS.map((v,i)=>'<div class="station '+(i<state.completed?'done':i===state.room?'current':'')+'"'+(i===state.room?' aria-current="step"':'')+'><b>'+(i<state.completed?'✓':String(i+1).padStart(2,'0'))+'</b><div><strong>'+v.name+'</strong><small>'+v.skill+'</small></div></div>').join('');$('scene').innerHTML=sceneArt(state.room)+'<div class="scene-top"><span>SCENE '+String(state.room+1).padStart(2,'0')+' / '+r.en+'</span><span>NCNU · 23:30</span></div><div class="scene-bottom">探索兩份線索，再操作出口裝置</div>';r.clues.forEach((c,i)=>{const b=document.createElement('button');b.id='clue'+i;b.className='hotspot';b.style.left=c.pos[0]+'%';b.style.top=c.pos[1]+'%';b.setAttribute('aria-label','調查'+c.name);b.innerHTML='<span class="dot" aria-hidden="true"></span>'+c.name;b.onclick=()=>inspect(i);$('scene').append(b)});const b=document.createElement('button');b.className='hotspot';b.style.left=r.lockPos[0]+'%';b.style.top=r.lockPos[1]+'%';b.textContent='開啟裝置';b.setAttribute('aria-label','操作'+r.lockName);b.onclick=openLock;$('scene').append(b);renderPanel()}
function reset(){clearInterval(tick);state={phase:'ready',room:0,completed:0,solved:false,visited:ROOMS.map(()=>[false,false]),hintLevels:ROOMS.map(()=>0),badges:[],mistakes:0,hints:0,penalty:0};deadline=0;startedAt=0;renderRoom();refresh();say('點選開始探索，啟動 30 分鐘倒數。五關之間不會重設時間。');show('今晚，校園只剩下你','<p>晚自習結束，你收到一則沒有署名的訊息：「午夜前，請把校園的訊號找回來。」五個房間逐一上鎖，只有完成上一關，才會出現下一個方向。</p><div class="note">五關共用 30 分鐘。每次提交錯誤的四位數密碼，立即扣除 30 秒。提示不扣秒；閱讀線索及房間轉場時持續計時。</div><p class="fine">這是以暨南大學為背景的虛構故事，無鬼怪或突然驚嚇。所有推理知識都會在遊戲中提供；數學關卡可使用紙筆。</p>',[['開始探索',begin,true]])}
function begin(){if(state.phase!=='ready')return;state.phase='playing';startedAt=Date.now();deadline=startedAt+CONFIG.totalSeconds*1000;close();tick=setInterval(refresh,250);renderPanel();say('第 1 關開始。先調查座位卡與黑板，找到教室的出口密碼。')}
function inspect(i){if(!guard()||state.solved)return;state.visited[state.room][i]=true;renderPanel();const c=ROOMS[state.room].clues[i];show(c.title,c.body,[['收進筆記',close,true]]);say('已記錄「'+c.name+'」。可在「線索筆記」隨時重看。')}
function openLock(){if(!guard()||state.solved)return;const r=ROOMS[state.room];if(!state.visited[state.room].every(Boolean)){show('線索還沒有齊全','<p>先調查本房間的兩份線索，再操作'+r.lockName+'。這次不會扣秒。</p>',[['繼續探索',close,true]]);return}show(r.lockName,'<p>'+r.objective+'</p><form id="answerForm" novalidate><label for="answer" class="form-label">輸入四位數密碼</label><input id="answer" aria-describedby="answerHelp" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="····"><div id="answerHelp" class="fine">答錯扣 '+CONFIG.penaltySeconds+' 秒；空白或格式錯誤不扣秒。可使用全形數字。</div><button class="btn primary" type="submit">確認密碼</button></form>',[['返回房間',close]]);$('answerForm').onsubmit=e=>{e.preventDefault();submitAnswer($('answer').value)};$('answer').focus()}
function submitAnswer(raw){if(!guard()||state.solved)return;const v=String(raw).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248));if(!/^\d{4}$/.test(v)){$('feedback').textContent='請輸入完整的四位數字。格式錯誤不扣秒。';return}if(!state.visited[state.room].every(Boolean))return;if(v!==ROOMS[state.room].answer){state.mistakes++;state.penalty+=CONFIG.penaltySeconds;deadline-=CONFIG.penaltySeconds*1000;renderPanel();const msg='密碼錯誤，扣除 '+CONFIG.penaltySeconds+' 秒。累計扣除 '+state.penalty+' 秒。';say(msg,true);if(refresh()>0){$('feedback').textContent=msg;$('answer').value='';$('answer').focus()}return}completeRoom()}
function completeRoom(){state.solved=true;state.completed=state.room+1;const r=ROOMS[state.room];if(r.badge)state.badges.push({...r.badge,room:r.name});renderRoom();if(state.room===4){state.phase='won';clearInterval(tick);const elapsed=Math.max(0,Math.floor((Date.now()-startedAt)/1000)),left=refresh();renderPanel();show('校園的燈，重新亮了','<div class="success-mark">CAMPUS SIGNAL RESTORED</div><p>'+r.reward+'</p><div class="result-grid"><div>實際遊玩時間<strong>'+formatTime(elapsed)+'</strong></div><div>剩餘時間<strong>'+formatTime(left)+'</strong></div><div>答錯懲罰<strong>'+state.mistakes+' 次 / '+state.penalty+' 秒</strong></div><div>提示使用<strong>'+state.hints+' 次</strong></div></div><p>五個房間全部通關。'+(state.mistakes===0&&state.hints===0?'沒有誤判，也沒有求助，你是今晚最敏銳的校園導航員。':'每一段推理，都是你走出午夜校園的路標。')+'</p>',[['查看校園',close],['再次挑戰',reset,true]]);say('五關全數通關！校園封鎖解除，倒數已停止。');return}show('第 '+state.completed+' 關通過','<p>'+r.reward+'</p><div class="clue">獲得徽記：<b>'+r.badge.symbol+' '+r.badge.name+' · '+r.badge.digit+'</b><br>這個數字會留在線索筆記，最後一關需要它。</div><p>下一站：'+ROOMS[state.room+1].name+'。難度 '+(state.room+2)+' / 5。<br>轉場時倒數繼續，剩餘時間不會重設。</p>',[['進入下一個房間',nextRoom,true]]);say('第 '+state.completed+' 關已通過。點選「進入下一個房間」繼續。')}
function nextRoom(){if(!guard()||!state.solved||state.room>=4)return;state.room++;state.solved=false;close();renderRoom();say('已抵達第 '+(state.room+1)+' 關：'+ROOMS[state.room].name+'。調查新的線索；先前的徽記已保留。')}
function hint(){if(!guard()||state.solved)return;const i=state.room,n=state.hintLevels[i];if(n>=3){show('本關提示已全部顯示','<p>'+ROOMS[i].hints[2]+'</p><p class="fine">重看最後提示不會增加使用次數。</p>',[['繼續探索',close,true]]);return}state.hintLevels[i]++;state.hints++;renderPanel();show('第 '+(i+1)+' 關提示 · '+(n+1)+' / 3','<p>'+ROOMS[i].hints[n]+'</p><p class="fine">提示由方向逐漸深入到解法。不扣秒，但倒數持續。累計使用 '+state.hints+' 次。</p>',[['繼續探索',close,true]])}
function journal(){if(state.phase==='ready')return;if(state.phase==='playing'&&!guard())return;let body='<p>已讀線索與通關徽記會自動記錄。未調查的線索不會在這裡提前顯示。</p><div class="clue">'+(state.badges.length?state.badges.map(b=>b.symbol+' '+b.name+' = <b>'+b.digit+'</b>（'+b.room+'）').join('<br>'):'尚未取得徽記。')+'</div>';ROOMS.forEach((r,ri)=>{if(!state.visited[ri].some(Boolean))return;body+='<details class="journal-card"'+(ri===state.room?' open':'')+'><summary>'+String(ri+1).padStart(2,'0')+' / '+r.name+'</summary>';r.clues.forEach((c,ci)=>{if(state.visited[ri][ci])body+='<h3 style="font-size:13px">'+c.title+'</h3>'+c.body});body+='</details>'});show('你的校園線索筆記',body,[['返回房間',close,true]])}
$('hint').onclick=hint;$('journal').onclick=journal;$('restart').onclick=()=>{if(state.phase==='playing'&&!guard())return;show('重新開始整段旅程？','<p>會清除五關進度、徽記、答錯及提示紀錄，時間回到 30:00。取消時不影響目前進度；確認視窗內也會繼續倒數。</p>',[['繼續目前挑戰',close],['確定重新開始',reset,true]])};modal.addEventListener('cancel',e=>{if(state.phase!=='playing'||state.solved)e.preventDefault()});

if(i===3){art+=win+'<rect x="285" y="108" width="360" height="185" fill="#bcc2aa" stroke="#6b7e70" stroke-width="6"/><text x="460" y="158" text-anchor="middle" fill="#345046" font-size="19" font-family="monospace">A + B = 10</text><text x="460" y="194" text-anchor="middle" fill="#345046" font-size="19" font-family="monospace">B = C + 2</text><text x="460" y="230" text-anchor="middle" fill="#345046" font-size="19" font-family="monospace">D = A + 2</text><path d="M53 367H681V403H53Z" fill="#7d9690"/><path d="M70 404H662V490H70Z" fill="#2b4f56"/><path d="M267 404V488M466 404V488" stroke="#608780" stroke-width="3"/>';[130,260,390,520].forEach((x,j)=>{art+='<g transform="translate('+x+' 295)"><path d="M-13 0H13V24L33 65Q35 73 25 73H-25Q-35 73 -33 65L-13 24Z" fill="#abc5b5" fill-opacity=".13" stroke="#b7d1c1" stroke-width="3"/><path d="M-21 47H21L30 67H-30Z" fill="'+['#c1ac76','#82a898','#7ca4b3','#c39681'][j]+'" opacity=".8"/><text x="0" y="100" text-anchor="middle" font-size="14" fill="#e0e2ca">'+['A','B','C','D'][j]+'</text></g>'});art+=door}
if(i===4){art+='<path d="M80 280A370 290 0 0 1 820 280" fill="#182e44" stroke="#70878a" stroke-width="13"/><path d="M450 1V270M120 218H780" stroke="#567681" stroke-width="5"/><path d="M385 2L390 268H510L520 2" fill="#0b1b30" stroke="#75878b" stroke-width="5"/>';for(const[x,y]of [[110,175],[220,140],[320,70],[415,108],[485,45],[577,100],[650,145],[745,190],[550,213],[280,210]])art+='<circle cx="'+x+'" cy="'+y+'" r="2" fill="#dbe2ca"/>';art+='<path d="M150 172L257 130L347 165L392 105" stroke="#d7bd88" fill="none" stroke-dasharray="4 6"/>';for(const[x,y]of [[150,172],[257,130],[347,165],[392,105]])art+='<circle cx="'+x+'" cy="'+y+'" r="6" fill="#efd08e"/>';art+='<g transform="translate(450 330) rotate(-28)"><rect x="-105" y="-35" width="236" height="65" rx="9" fill="#8fa8a3" stroke="#bdcab5" stroke-width="4"/><rect x="125" y="-44" width="25" height="83" rx="4" fill="#456978" stroke="#bdcab5" stroke-width="4"/><rect x="-135" y="-15" width="32" height="24" fill="#294653"/></g><path d="M450 355L355 532M450 355L535 532M450 355V532" stroke="#94aba1" stroke-width="11"/><rect x="705" y="325" width="149" height="123" rx="4" fill="#2a4750" stroke="#7d9c9b" stroke-width="4"/><rect x="721" y="342" width="117" height="70" fill="#0e2d38"/><text x="780" y="385" text-anchor="middle" fill="#d9c68a" font-size="14" font-family="monospace">SEND SIGNAL</text><path d="M723 450L699 511H860L839 450" fill="#3d5960"/><path d="M174 413H328V460H165Z" fill="#958c70"/><rect x="188" y="392" width="119" height="40" fill="#cdc69e" transform="rotate(-8 240 412)"/>'}
return '<svg viewBox="0 0 900 600" preserveAspectRatio="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">'+art+'<rect x="1" y="1" width="898" height="598" fill="none" stroke="#9bb69d" stroke-opacity=".12"/></svg>'}
reset();
